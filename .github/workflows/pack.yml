name: "Build package"

on: push

jobs:
    pack:
        name: Build package
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6

            - uses: pnpm/action-setup@v6
              with:
                  version: 11
                  cache: true

            - uses: actions/setup-node@v6
              with:
                  node-version: "24.x"

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Build package
              run: |
                  pnpm pack

            - uses: actions/upload-artifact@v6
              with:
                  path: "*.tgz"
